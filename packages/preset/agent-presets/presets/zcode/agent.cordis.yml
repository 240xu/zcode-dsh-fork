# The `zcode` agent preset: ZCode 3.10.2 behavior on the DSH runtime.
#
# AGENT-PLANE composition, mounted once per process like its siblings
# (`standard`, `minimal`, `cordis`, `ptc`). Every ZCode-facing text below comes
# from the verified evidence package (240xu/zcode-agent): the 30-tool
# definitions, the identity/Harness prompt sections, the dynamic-behavior
# section, the memory prompt, and the Explore subagent prompt, all extracted
# statically from the official ZCode Desktop 3.10.2 runtime and byte-verified.
#
# What this preset deliberately does NOT do: ship or execute the official
# ZCode runtime binary, re-register DSH's own tool names with ZCode descriptions
# (same-scope re-registration of a name the base rows registered throws in
# dsh-tools — ZCode tool semantics arrive as prompt sections from
# @deepseek-ai/dsh-zcode-prompt instead), or implement ZCode's private
# protocols. The agent loop, tool pipeline, permissions, session log, and TUI
# are DSH's own.
#
# Permission modes (ZCode 3.10.2 has build/edit/plan/yolo + internal auto;
# DSH permission is host-level, selected via DSH_PERMISSION_MODE):
# - ZCode `build` (ask before changes, the default) = DSH `workspace-write`
#   (the DSH default: write operations ask first).
# - ZCode `yolo` (full access) = DSH `danger-full-access` (never ask).
# - ZCode `plan` = the `planning` row below (plan-mode with ZCode semantics).
# - ZCode `edit` (auto-approve edits, ask for the rest) has no DSH host
#   equivalent: run under `workspace-write` and grant standing approvals at
#   the host, or under `danger-full-access` for full autonomy.
# - ZCode internal `auto` (subagents/background) = DSH's own agent machinery.

# ── identity ────────────────────────────────────────────────────────────────

# ZCode's CLI prefix and agent identity, stated as the deployment persona.
# `{{cwd}}` resolves from the agent's workspace.
# 0.1.5 schema: `text` renamed to `prefix` (suffix defaults to '' and is
# omitted — this text already carries the cwd line, rendering is unchanged).
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are ZCode, an interactive coding agent running on DeepSeek Harness.
      You are an interactive ZCode agent that helps users with software
      engineering tasks. Your working directory is {{cwd}}.

# ZCode behavior sections (identity/Harness, dynamic behavior, tool
# semantics) and the Explore-oriented subagent notes live in this plugin.
- id: zcode-prompt
  name: '@deepseek-ai/dsh-zcode-prompt'

# ── shell ───────────────────────────────────────────────────────────────────

# ZCode's Bash keeps the session working directory across calls, runs an
# optional background job, and enforces ZCode's timeouts (default 120000ms,
# cap 600000ms). Neither DSH bash variant covers that contract alone
# (plain: background without state; persistent: state without background,
# PTY-bound), so this preset-scoped row implements it over DSH's own shell
# seam. Registered as `bash`, shadowing the global registration inside the
# preset scope (a supported layering: nearer scopes shadow farther ones).
- id: tool-bash
  name: '@deepseek-ai/dsh-zcode-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── memory ──────────────────────────────────────────────────────────────────

# ZCode's persistent three-scope memory prompt and directory convention.
- id: zcode-memory
  name: '@deepseek-ai/dsh-zcode-memory'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature: an entry-local realm is the correct
# lifetime, exactly as in `standard`. The section text is ZCode's plan-mode
# semantics from the evidence package rather than DSH's default wording.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until the plan is approved or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it for approval.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions.

# ── compaction ──────────────────────────────────────────────────────────────

# Same shape as `standard`: the pruner shares the compaction realm.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation ──────────────────────────────────────────────────────────────

# The subagent REGISTRY stays in the HOST composition (see `standard`); this
# preset contributes the delegation TOOLS. ZCode exposes a single `Agent`
# multiplexer (subagent_type dispatch over general-purpose/Explore); the
# multiplexer row below implements exactly that contract over DSH's subagent
# seam with the oracle-verbatim personas and availability-gated filters.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-agent
      name: '@deepseek-ai/dsh-zcode-agent'

# ── remaining model-facing rows ─────────────────────────────────────────────

# ZCode's ReadSessionContext ("read bounded context from another persisted
# session") maps to DSH's session-query tools: session_search across prior
# sessions in this workspace, then session_event_search / session_trace /
# session_event_trace / session_event_read for lineage and exact data.
- id: tool-session-query
  name: '@deepseek-ai/dsh-tool-session-query'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ZCode exposes TodoRead beside TodoWrite with per-item `priority`, which
# DSH's tool-todo items cannot hold (core type: "No id, priority") — an
# oracle-shaped write is rejected even though the in-prompt ZCode text
# instructs the model to send `priority`. This preset-scoped row therefore
# REPLACES the core tool-todo row (same-scope duplicates throw): it owns the
# `todos` projection (mirrored fold) plus both tools, writing priority-
# stripped snapshots through the same `todo/write` event while priorities
# ride a session sidecar, returning the oracle result shapes.
- id: tool-todo-read
  name: '@deepseek-ai/dsh-zcode-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
